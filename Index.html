
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MK Iron's Album Art Creator</title>
  <!-- Google Fonts for stylish album typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700&family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&family=Rubik+Glitch&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0d0f14;
      --card-bg: #161b22;
      --accent-color: #ff3366;
      --accent-hover: #e02656;
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #11141a;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff3366, #ff758c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 24px;
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }

    @media (max-width: 992px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: fit-content;
      max-height: 85vh;
      overflow-y: auto;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    /* Tab Controls */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #0d1117;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Form Fields */
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px;
      background: #090d13;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 12px;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent-color);
    }

    input[type="file"] {
      width: 100%;
      padding: 8px;
      background: #090d13;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .color-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="color"] {
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    /* Accordion / Folders for text controls */
    details {
      background: #0d1117;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    details summary {
      cursor: pointer;
      font-weight: 700;
      color: #fff;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    details summary::after {
      content: '+';
      font-size: 1.2rem;
    }

    details[open] summary::after {
      content: '−';
    }

    details .details-body {
      margin-top: 14px;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: var(--accent-hover);
    }

    .action-btn:disabled {
      background: #444;
      cursor: not-allowed;
    }

    /* Preview Canvas Area */
    .preview-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .canvas-container {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      border: 2px solid var(--border-color);
      background: #000;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>MK Iron's Album Art Creator</h1>
  </header>

  <div class="container">
    <!-- CONTROLS PANEL -->
    <div class="panel">
      <!-- ARTWORK SOURCE -->
      <div>
        <div class="section-title">1. Artwork Background</div>
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('upload')">Upload Image</button>
          <button class="tab-btn" onclick="switchTab('ai')">AI Generator</button>
        </div>

        <div id="upload-tab" class="tab-content active">
          <label>Select an image from your device</label>
          <input type="file" id="imageUpload" accept="image/*" />
        </div>

        <div id="ai-tab" class="tab-content">
          <label>Describe your album cover (Prompt)</label>
          <input type="text" id="aiPrompt" placeholder="e.g. Cyberpunk metallic skull, dark neon atmosphere" />
          <button class="action-btn" id="generateAiBtn" onclick="generateAIArtwork()">Generate Artwork</button>
        </div>
      </div>

      <!-- TEXT SECTIONS (ARTIST, SONG, ALBUM) -->
      <div>
        <div class="section-title">2. Text Information & Styling</div>

        <!-- ARTIST SECTION -->
        <details open>
          <summary>Artist Name</summary>
          <div class="details-body">
            <label>Text</label>
            <input type="text" id="artistText" value="MK IRON" />
            
            <div class="row">
              <div>
                <label>Font</label>
                <select id="artistFont">
                  <option value="'Bebas Neue'">Bebas Neue</option>
                  <option value="'Montserrat'">Montserrat</option>
                  <option value="'Cinzel'">Cinzel</option>
                  <option value="'Playfair Display'">Playfair Display</option>
                  <option value="'Rubik Glitch'">Glitch</option>
                </select>
              </div>
              <div>
                <label>Size (px)</label>
                <input type="number" id="artistSize" value="70" min="20" max="200" />
              </div>
            </div>

            <div class="row">
              <div>
                <label>Position Preset</label>
                <select id="artistPlacement">
                  <option value="top">Top</option>
                  <option value="center">Center</option>
                  <option value="bottom">Bottom</option>
                </select>
              </div>
              <div>
                <label>Vertical Offset</label>
                <input type="number" id="artistOffset" value="120" />
              </div>
            </div>

            <div class="color-row">
              <label>Color:</label>
              <input type="color" id="artistColor" value="#ffffff" />
            </div>
          </div>
        </details>

        <!-- SONG TITLE SECTION -->
        <details style="margin-top: 10px;">
          <summary>Song Title</summary>
          <div class="details-body">
            <label>Text</label>
            <input type="text" id="songText" value="FORGED IN STEEL" />

            <div class="row">
              <div>
                <label>Font</label>
                <select id="songFont">
                  <option value="'Montserrat'">Montserrat</option>
                  <option value="'Bebas Neue'">Bebas Neue</option>
                  <option value="'Cinzel'">Cinzel</option>
                  <option value="'Playfair Display'">Playfair Display</option>
                  <option value="'Rubik Glitch'">Glitch</option>
                </select>
              </div>
              <div>
                <label>Size (px)</label>
                <input type="number" id="songSize" value="50" min="20" max="200" />
              </div>
            </div>

            <div class="row">
              <div>
                <label>Position Preset</label>
                <select id="songPlacement">
                  <option value="center" selected>Center</option>
                  <option value="top">Top</option>
                  <option value="bottom">Bottom</option>
                </select>
              </div>
              <div>
                <label>Vertical Offset</label>
                <input type="number" id="songOffset" value="0" />
              </div>
            </div>

            <div class="color-row">
              <label>Color:</label>
              <input type="color" id="songColor" value="#ff3366" />
            </div>
          </div>
        </details>

        <!-- ALBUM NAME SECTION -->
        <details style="margin-top: 10px;">
          <summary>Album Name</summary>
          <div class="details-body">
            <label>Text</label>
            <input type="text" id="albumText" value="CHRONICLES OF REIGN" />

            <div class="row">
              <div>
                <label>Font</label>
                <select id="albumFont">
                  <option value="'Cinzel'">Cinzel</option>
                  <option value="'Bebas Neue'">Bebas Neue</option>
                  <option value="'Montserrat'">Montserrat</option>
                  <option value="'Playfair Display'">Playfair Display</option>
                  <option value="'Rubik Glitch'">Glitch</option>
                </select>
              </div>
              <div>
                <label>Size (px)</label>
                <input type="number" id="albumSize" value="40" min="15" max="150" />
              </div>
            </div>

            <div class="row">
              <div>
                <label>Position Preset</label>
                <select id="albumPlacement">
                  <option value="bottom" selected>Bottom</option>
                  <option value="top">Top</option>
                  <option value="center">Center</option>
                </select>
              </div>
              <div>
                <label>Vertical Offset</label>
                <input type="number" id="albumOffset" value="-120" />
              </div>
            </div>

            <div class="color-row">
              <label>Color:</label>
              <input type="color" id="albumColor" value="#f0f6fc" />
            </div>
          </div>
        </details>
      </div>

      <!-- EXPORT BUTTON -->
      <button class="action-btn" onclick="downloadCover()">Download Cover (1000 x 1000)</button>
    </div>

    <!-- PREVIEW AREA -->
    <div class="preview-panel">
      <div class="canvas-container">
        <!-- High-res 1000x1000 canvas -->
        <canvas id="artCanvas" width="1000" height="1000"></canvas>
      </div>
      <p style="color: var(--text-muted); font-size: 0.9rem;">High-res live preview (1000 &times; 1000 px)</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('artCanvas');
    const ctx = canvas.getContext('2d');

    // Default background image
    let currentImage = new Image();
    currentImage.crossOrigin = "anonymous";
    currentImage.src = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1000&q=80';
    currentImage.onload = () => renderCanvas();

    // Tab switching (Upload vs AI)
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tab === 'upload') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('upload-tab').classList.add('active');
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('ai-tab').classList.add('active');
      }
    }

    // Handle Local Image Upload
    document.getElementById('imageUpload').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (event) {
          const img = new Image();
          img.onload = function () {
            currentImage = img;
            renderCanvas();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // AI Generation via Pollinations (Fast, free, keyless AI image service)
    function generateAIArtwork() {
      const prompt = document.getElementById('aiPrompt').value.trim();
      const btn = document.getElementById('generateAiBtn');

      if (!prompt) {
        alert('Please enter a description for the artwork.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Generating Artwork...';

      const seed = Math.floor(Math.random() * 1000000);
      const aiUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1000&height=1000&nologo=true&seed=${seed}`;

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = aiUrl;

      img.onload = function () {
        currentImage = img;
        renderCanvas();
        btn.disabled = false;
        btn.innerText = 'Generate Artwork';
      };

      img.onerror = function () {
        alert('Failed to generate AI image. Please check your network or try again.');
        btn.disabled = false;
        btn.innerText = 'Generate Artwork';
      };
    }

    // Calculate Y coordinate based on preset + offset
    function calculateY(placement, offset) {
      const canvasHeight = canvas.height;
      let baseY = canvasHeight / 2;

      if (placement === 'top') baseY = 100;
      if (placement === 'bottom') baseY = canvasHeight - 100;

      return baseY + parseInt(offset || 0, 10);
    }

    // Render Canvas
    function renderCanvas() {
      // 1. Draw Background Image
      if (currentImage.complete && currentImage.naturalWidth !== 0) {
        // Draw image covering the entire square (cover fit)
        const scale = Math.max(canvas.width / currentImage.width, canvas.height / currentImage.height);
        const x = (canvas.width / 2) - (currentImage.width / 2) * scale;
        const y = (canvas.height / 2) - (currentImage.height / 2) * scale;
        ctx.drawImage(currentImage, x, y, currentImage.width * scale, currentImage.height * scale);
      } else {
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Subtle dark gradient vignette for readable text
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, 'rgba(0, 0, 0, 0.4)');
      gradient.addColorStop(0.5, 'rgba(0, 0, 0, 0.1)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Common text settings
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 2. Render Artist Name
      drawTextLayer({
        text: document.getElementById('artistText').value,
        font: document.getElementById('artistFont').value,
        size: document.getElementById('artistSize').value,
        color: document.getElementById('artistColor').value,
        placement: document.getElementById('artistPlacement').value,
        offset: document.getElementById('artistOffset').value,
        letterSpacing: '4px'
      });

      // 3. Render Song Title
      drawTextLayer({
        text: document.getElementById('songText').value,
        font: document.getElementById('songFont').value,
        size: document.getElementById('songSize').value,
        color: document.getElementById('songColor').value,
        placement: document.getElementById('songPlacement').value,
        offset: document.getElementById('songOffset').value,
        letterSpacing: '2px'
      });

      // 4. Render Album Name
      drawTextLayer({
        text: document.getElementById('albumText').value,
        font: document.getElementById('albumFont').value,
        size: document.getElementById('albumSize').value,
        color: document.getElementById('albumColor').value,
        placement: document.getElementById('albumPlacement').value,
        offset: document.getElementById('albumOffset').value,
        letterSpacing: '3px'
      });
    }

    function drawTextLayer({ text, font, size, color, placement, offset }) {
      if (!text.trim()) return;

      const y = calculateY(placement, offset);
      ctx.font = `700 ${size}px ${font}`;
      
      // Text Shadow for contrast
      ctx.shadowColor = 'rgba(0,0,0,0.85)';
      ctx.shadowBlur = 15;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;

      ctx.fillStyle = color;
      ctx.fillText(text.toUpperCase(), canvas.width / 2, y);

      // Reset shadows
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }

    // Real-time Event Listeners for controls
    const inputIds = [
      'artistText', 'artistFont', 'artistSize', 'artistColor', 'artistPlacement', 'artistOffset',
      'songText', 'songFont', 'songSize', 'songColor', 'songPlacement', 'songOffset',
      'albumText', 'albumFont', 'albumSize', 'albumColor', 'albumPlacement', 'albumOffset'
    ];

    inputIds.forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', renderCanvas);
    });

    // Make sure custom Google Fonts trigger re-render on load
    document.fonts.ready.then(() => renderCanvas());

    // Download Finished Album Cover
    function downloadCover() {
      try {
        const link = document.createElement('a');
        link.download = `MK_Iron_${(document.getElementById('albumText').value || 'Album').replace(/\s+/g, '_')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        alert("Cross-Origin restrictions prevent saving external images directly. Please use an uploaded local photo to enable one-click download!");
      }
    }
  </script>
</body>
</html>
